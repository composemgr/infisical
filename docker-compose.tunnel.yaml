name: infisical
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  infisical:
    image: infisical/infisical:latest
    container_name: infisical-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      NODE_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-changeme_secret_key_min_32_chars}
      AUTH_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DB_CONNECTION_URI: postgres://${DB_USER_NAME:-infisical}:${DB_USER_PASS:-changeme_db_password}@infisical-db:5432/${DB_CREATE_DATABASE_NAME:-infisical}
      REDIS_URL: redis://infisical-redis:6379
      SITE_URL: http://${BASE_HOST_NAME:-$HOSTNAME}:64209
      CONTAINER_NAME: infisical-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/infisical:/data:z'
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://infisical-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - infisical
      - cloudflare
  infisical-db:
    image: postgres:16-alpine
    container_name: infisical-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: infisical-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-infisical}
      POSTGRES_USER: ${DB_USER_NAME:-infisical}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: infisical-db
    volumes:
      - './volumes/db/postgres/infisical:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infisical

  infisical-redis:
    image: redis:alpine
    container_name: infisical-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: infisical-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: infisical-redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infisical

networks:
  infisical:
    name: infisical
    external: false
  cloudflare:
    external: true
